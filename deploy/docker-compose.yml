name: multiplayer

services:
  api:
    build: ../api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://game:${POSTGRES_PASSWORD}@postgres:5432/game
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_HOST: ${PUBLIC_HOST}
      SERVER_KEY: ${SERVER_KEY}
      GAME_SERVER_IMAGE: ${GAME_SERVER_IMAGE}
      GAME_NETWORK: multiplayer_default
      API_URL_FOR_SERVERS: http://api:8080
    volumes:
      # lets the API start and stop game server containers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: game
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

  # ---------- monitoring ----------

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro,rslave
    command: ["--path.rootfs=/host"]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana

volumes:
  pgdata:
  promdata:
  grafanadata:
