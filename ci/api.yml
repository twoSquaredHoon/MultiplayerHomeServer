# Move this file to .github/workflows/api.yml
name: api

on:
  push:
    paths: ["api/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/twosquaredhoon/multiplayer-api:latest
